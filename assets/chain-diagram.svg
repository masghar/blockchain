<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Diagram: tampering with one block invalidates every block after it">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565d6a"/>
    </marker>
  </defs>

  <rect width="900" height="300" rx="18" fill="#f5f6fa"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#dde1e8" stroke-width="1.5"/>

  <text x="30" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#1a1d29" font-weight="600">
    Tamper with one block → every block after it fails validation
  </text>

  <!-- Row 1: healthy chain -->
  <text x="30" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#0f7a45">BEFORE — chain valid</text>
  <g font-family="ui-monospace, monospace" font-size="11">
    <!-- genesis -->
    <rect x="30" y="95" width="150" height="60" rx="8" fill="#ffffff" stroke="#0f7a45" stroke-width="2"/>
    <text x="45" y="118" fill="#1a1d29">Block #0</text>
    <text x="45" y="136" fill="#565d6a">genesis</text>

    <line x1="180" y1="125" x2="222" y2="125" stroke="#565d6a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="230" y="95" width="150" height="60" rx="8" fill="#ffffff" stroke="#0f7a45" stroke-width="2"/>
    <text x="245" y="118" fill="#1a1d29">Block #1</text>
    <text x="245" y="136" fill="#565d6a">alice→bob: 10</text>

    <line x1="380" y1="125" x2="422" y2="125" stroke="#565d6a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="430" y="95" width="150" height="60" rx="8" fill="#ffffff" stroke="#0f7a45" stroke-width="2"/>
    <text x="445" y="118" fill="#1a1d29">Block #2</text>
    <text x="445" y="136" fill="#565d6a">bob→carol: 3</text>
  </g>
  <text x="600" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#0f7a45">✓ valid</text>

  <!-- Row 2: tampered chain -->
  <text x="30" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#d92d3f">AFTER — block #1 tampered (10 → 99999)</text>
  <g font-family="ui-monospace, monospace" font-size="11">
    <rect x="30" y="213" width="150" height="60" rx="8" fill="#ffffff" stroke="#0f7a45" stroke-width="2"/>
    <text x="45" y="236" fill="#1a1d29">Block #0</text>
    <text x="45" y="254" fill="#565d6a">genesis</text>

    <line x1="180" y1="243" x2="222" y2="243" stroke="#565d6a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="230" y="213" width="150" height="60" rx="8" fill="#ffffff" stroke="#d92d3f" stroke-width="2.5"/>
    <text x="245" y="236" fill="#1a1d29">Block #1</text>
    <text x="245" y="254" fill="#d92d3f">alice→bob: 99999</text>

    <line x1="380" y1="243" x2="422" y2="243" stroke="#d92d3f" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <rect x="430" y="213" width="150" height="60" rx="8" fill="#ffffff" stroke="#d92d3f" stroke-width="2.5"/>
    <text x="445" y="236" fill="#1a1d29">Block #2</text>
    <text x="445" y="254" fill="#565d6a">bob→carol: 3</text>
  </g>
  <text x="600" y="246" font-family="system-ui, sans-serif" font-size="13" fill="#d92d3f">✕ invalid: [1, 2]</text>
</svg>
